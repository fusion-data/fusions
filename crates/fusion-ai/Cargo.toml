[package]
name = "fusion-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[lints]
# workspace = true

[features]
default = ["schemars/chrono04", "with-db", "image", "audio", "video"]
with-db = ["dep:sqlx", "sqlx/postgres"]
image = []
audio = []
video = []
docsrs = []

[dependencies]
fusion-common = { workspace = true, features = ["with-uuid"] }
tokio = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
ureq = { workspace = true }
http = { workspace = true }
mime = { workspace = true }
dashmap = { workspace = true }
async-trait = { workspace = true }
sqlx = { workspace = true, optional = true }
derive_builder = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
eventsource-stream = { workspace = true }
ahash = { workspace = true }
# tracing log
tracing = { version = "0.1" }
base64 = { workspace = true }
serde_path_to_error = { workspace = true }
tracing-futures = { version = "0.2", features = ["futures-03"] }
regex = { workspace = true }
tokio-tungstenite = { workspace = true, default-features = true, features = [
  "connect",
  "handshake",
  "rustls-tls-native-roots",
] }
tokio-util = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
dotenvy = { workspace = true }
logforth = { workspace = true }
sqlx = { workspace = true, features = [
  "runtime-tokio",
  "chrono",
  "json",
  "postgres",
] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { workspace = true }
# openai_compatible 行为基线 fixture（docs/exec-plans/active/fusion-ai-de-rig.md P0）
wiremock = "0.6"
futures = { workspace = true }
serde_json = { workspace = true }
