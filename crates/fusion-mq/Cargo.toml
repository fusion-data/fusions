[package]
name = "fusion-mq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Fusion message queue abstraction (event producer / consumer trait + Postgres provider)"
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["with-postgres"]
with-postgres = ["dep:sqlx"]

[dependencies]
fusion-common.workspace = true
fusion-core.workspace = true
async-trait.workspace = true
chrono.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
sqlx = { workspace = true, features = ["postgres", "uuid"], optional = true }

[dev-dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
